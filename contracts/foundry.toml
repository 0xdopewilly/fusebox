[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# X Layer runs the OP Stack (Isthmus/Prague at the time of writing); cancun keeps us conservative.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 128
depth = 64

[rpc_endpoints]
xlayer = "https://rpc.xlayer.tech"
xlayer_drpc = "https://xlayer.drpc.org"
xlayer_tapeout = "https://tapeout.net/rpc-xlayer"

[lint]
# incorrect-shift: `1 << k` builds bit masks; the order is intended.
# block-timestamp: fuses work in hours and UTC days, far above any sequencer drift.
exclude_lints = ["incorrect-shift", "block-timestamp"]
ignore = ["test/**/*.sol"]

[fmt]
line_length = 120

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fusebox share card</title>
<style>
@font-face { font-family: "Archivo"; font-weight: 800; src: url("../../deweb/src/fonts/archivo-800.woff2") format("woff2"); }
@font-face { font-family: "Geist"; font-weight: 400 600; src: url("../../deweb/src/fonts/geist.woff2") format("woff2"); }
@font-face { font-family: "Geist Mono"; font-weight: 500; src: url("../../deweb/src/fonts/geist-mono-500.woff2") format("woff2"); }
:root { --lime: #bbfe2f; --ink: #f2f2ee; --soft: #c9c9c4; --mute: #9d9d98; --red: #ff5232; --hair: rgba(255,255,255,.08); --hair2: rgba(255,255,255,.14); }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; background: #000; color: var(--ink); overflow: hidden; -webkit-font-smoothing: antialiased; font-family: "Geist", sans-serif; }
.m { font-family: "Geist Mono", monospace; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.lime { color: var(--lime); } .mute { color: var(--mute); } .red { color: var(--red); }
.grid { position: absolute; inset: 0 40px; display: grid; grid-template-columns: repeat(6, 1fr); }
.grid i { border-left: 1px solid var(--hair); } .grid i:last-child { border-right: 1px solid var(--hair); }
.top { position: absolute; left: 40px; right: 40px; top: 0; height: 84px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--hair2); }
.logo { display: flex; align-items: center; gap: 14px; font-family: "Archivo"; font-weight: 800; font-size: 28px; text-transform: uppercase; letter-spacing: -.01em; }
.dot { display: inline-block; width: 9px; height: 9px; background: var(--lime); margin-right: 10px; }
.body { position: absolute; left: 40px; top: 128px; width: 720px; }
h1 { font-family: "Archivo"; font-weight: 800; text-transform: uppercase; letter-spacing: -.04em; line-height: .86; font-size: 100px; margin-top: 22px; }
p { margin-top: 28px; font-size: 25px; line-height: 1.42; color: var(--soft); width: 640px; }
.chips { display: flex; gap: 10px; margin-top: 26px; flex-wrap: wrap; width: 700px; }
.chips span { border: 1px solid var(--hair2); padding: 8px 12px; color: var(--soft); }
.art { position: absolute; right: 14px; top: 196px; width: 430px; image-rendering: pixelated; mix-blend-mode: lighten; }
.foot { position: absolute; left: 40px; right: 40px; bottom: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--hair2); }
</style>
</head>
<body>
<div class="grid"><i></i><i></i><i></i><i></i><i></i><i></i></div>
<div class="top">
  <div class="logo"><svg width="44" height="20" viewBox="0 0 30 14"><rect x=".5" y="1.5" width="6" height="11" fill="#f2f2ee"/><rect x="23.5" y="1.5" width="6" height="11" fill="#f2f2ee"/><rect x="6.5" y="3.5" width="17" height="7" fill="none" stroke="#f2f2ee"/><path d="M6.5 7h4.5l1.6-2.6 2 5.2 1.6-2.6h7.3" fill="none" stroke="#bbfe2f" stroke-width="1.4"/></svg>Fusebox</div>
  <div class="m mute"><span class="dot"></span>X Layer mainnet · chain 196</div>
</div>
<div class="body" id="body"></div>
<img class="art" id="art" alt="">
<div class="foot m mute"><span>AI agents pay. <span class="lime">Circuits decide.</span></span><span style="color:var(--ink)" id="url">fusebox-xlayer.vercel.app</span></div>
<script>
const V = {
  docs: { eyebrow: '<span class="lime">[Docs]</span> <span class="mute">Build with Fusebox</span>', h1: 'Build with<br><span class="lime">[Fusebox]</span>.', p: "Wallets for AI agents whose payments must pass logic circuits taped out on TapeOut.", chips: ["Quickstart", "Wallet API", "MCP tools", "Sell a fuse", "Contracts"], art: "intact", url: "fusebox-xlayer.vercel.app/docs" },
  app: { eyebrow: '<span class="lime">[Atlas]</span> <span class="mute">A live agent wallet on X Layer</span>', h1: 'Try to<br><span class="red">[scam]</span> it.', p: "Pick a trick an invoice scammer would use. Atlas's real fuses decide on mainnet: free, read-only, nothing moves.", chips: ["Daily Cap", "Payee Guard", "Breaker", "Two of Three"], art: "blown", url: "fusebox-xlayer.vercel.app/app" },
};
const v = V[new URLSearchParams(location.search).get("v") || "docs"];
document.getElementById("body").innerHTML = `<div class="m">${v.eyebrow}</div><h1>${v.h1}</h1><p>${v.p}</p><div class="chips m">${v.chips.map((c) => `<span>${c}</span>`).join("")}</div>`;
document.getElementById("art").src = `../../deweb/src/fuse-${v.art}.png`;
document.getElementById("url").textContent = v.url;
</script>
</body>
</html>
